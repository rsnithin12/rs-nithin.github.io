short_bio: >-
  <p>
  I am a Computer Science researcher interested in building AI systems that are reliable, explainable, and useful in real-world enivronments.
  My work lies at the intersection of trustworthy AI, machine learning, privacy & security systems, and human-centered AI.
  </p>
  <p>
  I am currently completing my masters and looking for <b style="color: #4dabf7;">Ph.D. and Research positions</b>, where my research focuses on Explainable AI and trustworthy machine 
  learning. I am particularly interested in understanding when and why AI systems make decisions, how people interpret those decisions, 
  and how we can design models that support appropriate human reliance. My long-term goal is to pursue research that makes AI systems more 
  transparent, dependable, and responsible.
  </p>

